<h2>Список книг</h2>

<div class="books">
  @for (book of books; track book.id) {
    <article class="book">
      <h3>{{ book.title }}</h3>

      <p><strong>Автор:</strong> {{ book.author }}</p>

      <p>{{ book.description }}</p>

      <a [routerLink]="['/book', book.id]">Детальніше</a>
    </article>
  }
</div>

<a class="add-link" routerLink="/books/add">Додати нову книгу</a>
